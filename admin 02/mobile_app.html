<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Mobile Screens</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* ==========================================================
               BẢNG MÀU CHỦ ĐẠO THEO YÊU CẦU:
               - NỀN (BACKGROUND): Hồng Vàng (Rose Gold) mềm mại, quý phái
               - NÚT BẤM (BUTTONS): Nâu cafe chocolate (Warm Mocha Brown)
               ========================================================== */
            --theme-rosegold-bg: #F8E3DA;  /* Nền hồng vàng (Rose Gold / Pink-Gold) sang trọng */
            --theme-rosegold-soft: #FBF0EB;/* Hồng vàng nhạt cho surface tint */
            --theme-rosegold-grad: linear-gradient(165deg, #F9DFE7 0%, #F8E4D9 35%, #FBF1D5 70%, #FCE4DB 100%);
            
            --theme-cream: #FCF8D5;        /* Vàng kem nhạt */
            --theme-pink: #F6CFDF;         /* Hồng phấn pastel */
            --theme-brown: #684E3F;        /* Nâu cafe mocha chủ đạo cho nút */

            /* Biến thể độ tương phản & chữ */
            --theme-brown-dark: #3E2B20;   /* Nâu espresso đậm - màu chữ chính, viền điện thoại */
            --theme-brown-hover: #533B2E;  /* Nâu sẫm khi hover nút bấm */
            --theme-brown-light: #F7EFE9;  /* Nền nâu kem siêu nhạt cho chip, tag */

            --theme-pink-hover: #ECA4C0;   /* Hồng hover */
            --theme-pink-dark: #9E456A;    /* Hồng berry đậm */
            --theme-pink-light: #FDF2F7;   /* Hồng phấn nhạt */

            --theme-cream-dark: #EEDB92;   /* Vàng kem viền / thanh tiến độ */
            --theme-cream-light: #FFFDF4;  /* Trắng kem ấm áp cho bề mặt thẻ */

            /* Semantic tokens */
            --bg-color: #F8E3DA;           /* NỀN ỨNG DỤNG HỒNG VÀNG */
            --card-bg: #FFFFFF;            /* Nền card trắng ấm */
            --text-main: #3E2B20;          /* Chữ chính: Nâu đậm sang trọng, tương phản cao */
            --text-muted: #826E62;         /* Chữ phụ: Nâu taupe ấm áp */
            
            --primary: #684E3F;            /* NÚT BẤM CHÍNH: NÂU CAFE MOCHA */
            --primary-light: #F7EFE9;      /* Nền sáng phụ trợ */
            --secondary: #684E3F;          /* Đồng bộ nút bấm tông nâu */
            --secondary-dark: #533B2E;
            --accent: #FCF8D5;             /* Điểm nhấn: Vàng kem */

            /* Màu chỉ báo chức năng */
            --blue: #5C7EA8;
            --green: #4E8B67;
            --red: #C54E60;
            --orange: #D67A43;
            --yellow: #E5AC38;
            --pink: #F6CFDF;
            --purple: #8B658E;

            --border-color: #F0DFD7;
            --glass-bg: rgba(255, 255, 255, 0.90);
            --glass-border: rgba(246, 207, 223, 0.65);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #EFE2DC 0%, #E8D6CF 50%, #ECE0D7 100%); padding: 40px; min-height: 100vh; }
        .gallery-title { text-align: center; font-size: 32px; font-weight: 800; color: #3E2B20; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        .gallery { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
        
        .mobile-container {
            width: 375px; height: 812px;
            background-color: var(--bg-color);
            background: var(--theme-rosegold-grad);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(62, 43, 32, 0.28);
            position: relative;
            border: 12px solid #3E2B20;
            display: flex;
            flex-direction: column;
        }
        
        .mobile-content { flex: 1; overflow-y: auto; position: relative; }
        .mobile-content::-webkit-scrollbar { display: none; }
        
        /* Utils */
        .p-20 { padding: 20px; } .pt-20 { padding-top: 20px; } .pb-20 { padding-bottom: 20px; } .pt-40 { padding-top: 40px; } .pt-15 { padding-top: 15px; }
        .mt-5 { margin-top: 5px; } .mt-10 { margin-top: 10px; } .mt-15 { margin-top: 15px; } .mt-20 { margin-top: 20px; } .mt-30 { margin-top: 30px; } .mt-40 { margin-top: 40px; }
        .mb-10 { margin-bottom: 10px; } .mb-15 { margin-bottom: 15px; } .mb-20 { margin-bottom: 20px; } .mb-30 { margin-bottom: 30px; } .mb-40 { margin-bottom: 40px; }
        .ml-5 { margin-left: 5px; } .ml-auto { margin-left: auto; }
        .flex-col { display: flex; flex-direction: column; } .h-full { height: 100%; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .text-center { text-align: center; } .text-left { text-align: left; }
        .text-primary { color: var(--primary); } .text-error { color: var(--red); } .text-success { color: var(--green); }
        .text-muted { color: var(--text-muted); } .text-blue { color: var(--blue); } .text-yellow { color: var(--yellow); } .text-orange { color: var(--orange); } .text-main { color: var(--text-main); }
        .font-bold { font-weight: 700; } .font-medium { font-weight: 500; }
        .text-sm { font-size: 13px; } .text-lg { font-size: 18px; } .text-2xl { font-size: 24px; }
        .w-full { width: 100%; } .flex-1 { flex: 1; } .opacity-50 { opacity: 0.5; }
        .border-t { border-top: 1px solid var(--border-color); } .rounded-xl { border-radius: 12px; }
        
        .bg-pink { background-color: var(--theme-pink); color: #523727; font-weight: 600; }
        .bg-purple { background-color: var(--purple); color: white; }
        .bg-blue { background-color: var(--blue); color: white; }
        .bg-orange { background-color: var(--orange); color: white; }
        .bg-green { background-color: var(--green); color: white; }
        .bg-red { background-color: var(--red); color: white; }
        .bg-cream { background-color: var(--theme-cream); color: #523727; font-weight: 600; }
        .bg-brown { background-color: var(--theme-brown); color: #FFFDF8; }
        .bg-pink-light { background-color: var(--theme-pink-light); }
        .bg-cream-light { background-color: var(--theme-cream-light); }
        .bg-orange-light { background-color: #FDF0E6; }
        .bg-blue-light { background-color: #F0F4FA; }
        .border-blue { border-color: #D3DFEE; }
        .border-cream { border-color: var(--theme-cream-dark); }
        .border-pink { border-color: var(--theme-pink); }

        .glass-card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1.5px solid var(--glass-border); border-radius: 20px; box-shadow: 0 6px 18px -2px rgba(104, 78, 63, 0.06); }
        .text-gradient { background: linear-gradient(135deg, var(--theme-brown) 0%, #A84D72 50%, var(--theme-pink) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Buttons: TẤT CẢ NÚT ĐỀU ĐỂ MÀU NÂU CAFE MOCHA ĐẬM RÕ NÉT */
        .btn-primary { 
            background: var(--primary); 
            color: #FFFDF8; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 14px; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 6px 16px -2px rgba(104, 78, 63, 0.35);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover { background: var(--theme-brown-hover); transform: translateY(-1px); box-shadow: 0 8px 20px -2px rgba(104, 78, 63, 0.45); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary {
            background: var(--theme-brown);
            color: #FFFDF8;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 16px -2px rgba(104, 78, 63, 0.3);
        }
        .btn-secondary:hover { background: var(--theme-brown-hover); }
        .btn-outline { 
            background: #FFFFFF; 
            color: var(--theme-brown); 
            border: 2px solid var(--theme-brown); 
            padding: 12px 24px; 
            border-radius: 14px; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            transition: 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(104, 78, 63, 0.08);
        }
        .btn-outline:hover { background: var(--theme-brown); color: #FFFDF8; }
        .btn-text { background: transparent; color: var(--primary); border: none; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-text:hover { color: var(--theme-brown-hover); }
        .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 10px; }
        .shadow-glow { box-shadow: 0 8px 18px -2px rgba(104, 78, 63, 0.35); }
        .ai-glow-btn { 
            background: linear-gradient(135deg, #4A3428 0%, #684E3F 60%, #9B5570 100%); 
            box-shadow: 0 10px 20px -3px rgba(104, 78, 63, 0.38); 
            border: none; 
            color: #FFFDF8; 
            padding: 14px; 
            border-radius: 14px; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .ai-glow-btn:hover { opacity: 0.95; transform: translateY(-1px); }

        /* Status & Top bar */
        .status-bar { display: flex; justify-content: space-between; padding: 12px 20px 8px; font-size: 13px; font-weight: 600; color: var(--theme-brown-dark); z-index: 10; }
        .status-icons { display: flex; gap: 6px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: transparent; z-index: 9; color: var(--theme-brown-dark); }
        .top-bar .title { font-weight: 700; font-size: 17px; color: var(--theme-brown-dark); }
        .back-btn { font-size: 18px; cursor: pointer; color: var(--theme-brown); }

        /* Bottom Nav */
        .bottom-nav { 
            background: rgba(255, 250, 247, 0.96); 
            backdrop-filter: blur(12px); 
            display: flex; 
            justify-content: space-around; 
            padding: 14px 0 16px; 
            border-top: 1px solid #F0DFD7; 
            z-index: 10; 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            border-bottom-left-radius: 28px; 
            border-bottom-right-radius: 28px; 
            box-shadow: 0 -4px 16px rgba(104, 78, 63, 0.05);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9C897D; text-decoration: none; font-size: 11px; font-weight: 600; transition: 0.2s; position: relative; }
        .nav-item.active { color: var(--theme-brown); font-weight: 700; }
        .nav-icon { font-size: 21px; margin-bottom: 2px; }
        .nav-item.active .nav-icon { transform: translateY(-2px); color: var(--theme-brown); }
        .nav-item.active::after {
            content: '';
            width: 5px; height: 5px;
            background: var(--theme-brown);
            border-radius: 50%;
            margin-top: 2px;
        }

        .bottom-action-row { display: flex; gap: 12px; width: 100%; }
        .bottom-action-fixed { width: 100%; }
        
        /* Home Screen */
        .home-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 20px; background: rgba(255, 255, 255, 0.95); border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 4px 12px -2px rgba(104, 78, 63, 0.06); border-bottom: 1px solid #F0DFD7; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; background: #F7EFE9; border: 2.5px solid var(--theme-pink); box-shadow: 0 3px 8px rgba(104, 78, 63, 0.1); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .greeting-sub { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        .greeting-name { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .header-actions { display: flex; gap: 12px; }
        .action-btn { width: 38px; height: 38px; border-radius: 50%; background: #FFFFFF; border: 1px solid #F0DFD7; display: flex; justify-content: center; align-items: center; font-size: 16px; color: var(--text-main); gap: 4px; box-shadow: 0 2px 6px rgba(104, 78, 63, 0.05); }
        .section { padding: 20px; }
        .section-title { font-size: 13px; font-weight: 800; color: var(--text-muted); margin-bottom: 16px; letter-spacing: 0.5px; text-transform: uppercase; }
        
        .progress-container { margin-bottom: 20px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .progress-bar-bg { height: 9px; background: #EEDBCE; border-radius: 6px; overflow: hidden; width: 100%; }
        .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 6px; transition: width 0.5s; }
        
        .task-item { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 14px; font-weight: 600; color: var(--text-main); cursor: pointer; }
        .checkbox { width: 22px; height: 22px; border: 2px solid #D6C4B6; border-radius: 7px; display: flex; justify-content: center; align-items: center; color: transparent; transition: 0.2s; background: #FFF; }
        .checkbox.checked { background: var(--primary); border-color: var(--primary); color: #FFFDF8; }
        
        .ai-banner { 
            background: linear-gradient(135deg, #684E3F 0%, #8D5468 50%, #EFA7C3 100%); 
            border-radius: 22px; 
            padding: 24px 20px; 
            color: #FFFDF8; 
            margin: 0 20px; 
            display: flex; 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0 12px 24px -4px rgba(104, 78, 63, 0.28); 
        }
        .ai-banner-content { position: relative; z-index: 2; width: 72%; }
        .ai-banner-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; line-height: 1.3; }
        .ai-banner-desc { font-size: 13px; opacity: 0.95; margin-bottom: 16px; line-height: 1.4; }
        .ai-banner-btn { background: #3E2B20; color: #FFFDF8; border: none; padding: 10px 18px; border-radius: 20px; font-weight: 800; font-size: 12px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.18); transition: 0.2s; }
        .ai-banner-btn:hover { background: #533B2E; }
        
        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .game-card { background: #FFFFFF; border-radius: 20px; padding: 20px; text-align: center; border: 1.5px solid #F0DFD7; box-shadow: 0 4px 12px rgba(104, 78, 63, 0.05); }
        .game-icon { width: 50px; height: 50px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 24px; margin: 0 auto 12px; }
        .game-title { font-size: 14px; font-weight: 700; color: var(--text-main); }
        
        .search-bar { background: #FFFFFF; padding: 12px 16px; border-radius: 16px; display: flex; align-items: center; gap: 12px; border: 1.5px solid #EBDED3; box-shadow: 0 2px 6px rgba(104, 78, 63, 0.03); }
        .search-bar input { border: none; outline: none; background: transparent; width: 100%; font-size: 15px; color: var(--text-main); }
        .search-bar i { color: var(--theme-brown); }
        
        .topic-list-item { background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 16px; margin-bottom: 16px; border: 1.5px solid #F0DFD7; box-shadow: 0 3px 8px rgba(104, 78, 63, 0.04); }
        .topic-icon-lg { width: 48px; height: 48px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 20px; flex-shrink: 0; }
        .topic-info { flex: 1; }
        .topic-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .topic-stats { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        
        /* Flashcards */
        .flashcard-container { display: flex; flex-direction: column; height: 100%; padding-bottom: 20px; }
        .flashcard-header { display: flex; justify-content: space-between; font-weight: 700; color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        .flashcard { background: #FFFFFF; border-radius: 26px; flex: 1; padding: 26px; display: flex; flex-direction: column; position: relative; box-shadow: 0 12px 30px -6px rgba(104, 78, 63, 0.09); border: 2px solid #F0DFD7; min-height: 400px; }
        .fc-top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .fc-badge { background: #FDE8F1; color: #9A4367; border: 1px solid #F6CFDF; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; }
        .fc-top-right { display: flex; align-items: center; gap: 12px; }
        .fc-lightbulb-btn { 
            width: 38px; height: 38px; 
            border-radius: 50%; 
            background: #FFF9E6; 
            border: 1.5px solid #F5DA88; 
            color: #D48806; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; 
            font-size: 17px; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 2px 6px rgba(212, 136, 6, 0.15); 
        }
        .fc-lightbulb-btn:hover, .fc-lightbulb-btn.active { 
            background: #FFD666; 
            color: #592400; 
            transform: scale(1.1); 
            box-shadow: 0 4px 14px rgba(212, 136, 6, 0.45); 
            border-color: #FAAD14;
        }
        .fc-hint-text-wrapper {
            animation: fadeInDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fc-like { font-size: 24px; color: #D8C6B9; cursor: pointer; transition: 0.2s; }
        .fc-like:hover { color: #E26588; }
        .fc-like.text-error { color: #E26588; }
        .fc-word-container { text-align: center; margin: auto 0; }
        .fc-word { font-size: 32px; font-weight: 800; color: var(--text-main); display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 12px; }
        .fc-ipa { font-size: 18px; color: var(--text-muted); }
        .fc-bottom-hint { text-align: center; color: var(--text-muted); font-size: 14px; font-weight: 600; margin-top: auto; padding-top: 20px; }
        
        .fc-actions { display: flex; gap: 8px; margin-top: 20px; width: 100%; }
        .fc-level-btn {
            flex: 1;
            padding: 10px 4px;
            font-size: 13.5px;
            font-weight: 700;
            border-radius: 14px;
            background: #FFFFFF;
            color: var(--theme-brown);
            border: 2px solid var(--theme-brown);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow: 0 2px 6px rgba(104, 78, 63, 0.08);
        }
        .fc-level-btn:hover {
            background: var(--theme-brown);
            color: #FFFDF8;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(104, 78, 63, 0.25);
        }
        .fc-level-btn:hover .fc-level-sub { color: #EEDBCE; }
        .fc-level-btn.active {
            background: var(--theme-brown);
            color: #FFFDF8;
            box-shadow: 0 4px 12px rgba(104, 78, 63, 0.3);
        }
        .fc-level-btn.active .fc-level-sub { color: #EEDBCE; }
        .fc-level-sub {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .fc-extra-actions { margin-top: 20px; text-align: center; }
        
        .fc-divider { height: 2px; background: #EEDBCE; margin: 24px auto; width: 60px; border-radius: 2px; }
        .fc-meaning { font-size: 18px; line-height: 1.5; color: var(--text-main); font-weight: 600; }
        
        .ai-input-wrapper { display: flex; gap: 8px; margin-top: 20px;}
        .ai-input { flex: 1; border: 2px solid #EBDED3; border-radius: 12px; padding: 12px 16px; font-size: 14px; outline: none; background: #FFF; color: var(--text-main); }
        .ai-input:focus { border-color: var(--primary); }
        .user-sentence { background: #FDFBF8; padding: 16px; border-radius: 16px; border: 1.5px solid #EEDBCE; }
        .sentence-label { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .sentence-text { font-size: 16px; font-weight: 600; text-decoration: line-through; }
        .error-box { background: #FFF5F7; border: 1.5px solid #FAD1DE; border-radius: 16px; padding: 16px; margin-top: 16px; }
        .feedback-status { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .fb-label { font-size: 12px; color: var(--text-muted); font-weight: 700; }
        .fb-value { font-size: 15px; margin-top: 4px; line-height: 1.4; color: var(--text-main); }
        .fb-badge { display: inline-block; background: #FCE8F0; color: #C54E60; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; margin-top: 4px; border: 1px solid #F8D2E2; }
        
        /* Story */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 14px 16px; background: #FFFFFF; border: 1.5px solid #EBDED3; border-radius: 12px; font-size: 15px; color: var(--text-main); font-weight: 600; outline: none; appearance: none; }
        .level-selector { display: flex; gap: 10px; }
